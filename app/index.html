<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Será Golpe?</title>
<meta name="description" content="App para ajudar pessoas idosas a reconhecer o estelionato digital.">
<meta name="theme-color" content="#3f37c9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Será Golpe?">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/apple-touch-icon-180.png">
<link rel="icon" href="icones/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ind:#3f37c9; --ind2:#2b2499; --indl:#e9e7ff;
  --g:#1f9d55; --gl:#dcf5e6; --y:#ffb703; --yd:#8a5a00; --yl:#fff1cc; --r:#e3342f; --rl:#ffe1df;
  --ink:#1b1b2f; --mut:#55566b; --line:#dcdbee; --bg:#f6f6fb;
  --pink:#d1449a; --cyan:#0f8fb3; --orange:#e8641c; --wa:#1f9d55;
}
html{font-size:17px}
html.f2{font-size:19px}
html.f3{font-size:21.5px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Nunito","Segoe UI",Roboto,Arial,sans-serif;background:#ecebf8;color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#app{position:relative;width:100%;max-width:440px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:700px){
  body{display:flex;align-items:center;justify-content:center;padding:20px}
  #app{height:min(900px,calc(100dvh - 40px));border-radius:42px;border:12px solid #16181b;box-shadow:0 20px 50px rgba(30,25,90,.3)}
}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.content{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 22px;display:flex;flex-direction:column;gap:.75rem}
.content.nopad{padding-top:14px}
.content>*{flex-shrink:0}
svg.i{width:1.3rem;height:1.3rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.h1{font-size:1.55rem;font-weight:900;line-height:1.15}
.h2{font-size:1.15rem;font-weight:900}
.p{font-size:1rem;line-height:1.45}
.mut{color:var(--mut)}
.small{font-size:.85rem}
.row{display:flex;align-items:center;gap:.6rem}
.between{justify-content:space-between}
.lights{display:inline-flex;gap:4px;background:#1b1b2f;padding:5px 7px;border-radius:999px}
.lights span{width:11px;height:11px;border-radius:50%}
.card{background:#fff;border-radius:20px;padding:.9rem;box-shadow:0 2px 0 var(--line)}
.tile{background:#fff;border-radius:20px;padding:.8rem;display:flex;flex-direction:column;gap:.35rem;box-shadow:0 2px 0 var(--line);text-align:left;min-height:44px}
.tile:active,.btn:active,.key:active,.chip:active{transform:translateY(2px)}
.blob{width:3rem;height:3rem;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.blob svg.i{width:1.6rem;height:1.6rem}
.tile .t{font-size:1rem;font-weight:900;line-height:1.15}
.tile .s{font-size:.85rem;color:var(--mut);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.btn{min-height:3.1rem;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:.5rem;font-weight:900;font-size:1.05rem;padding:0 1rem;width:100%;transition:transform .05s}
.btn.pri{background:var(--ind);color:#fff;box-shadow:0 4px 0 var(--ind2)}
.btn.pri:disabled{background:#b9b6ec;box-shadow:0 4px 0 #a19dde;cursor:not-allowed}
.btn.out{background:#fff;color:var(--ind);border:2px solid var(--ind)}
.btn.ghost{color:var(--ind);min-height:2.75rem}
.btn.red{background:var(--r);color:#fff;box-shadow:0 4px 0 #a8201b}
.btn.green{background:var(--g);color:#fff;box-shadow:0 4px 0 #13703b}
.backbar{display:flex;align-items:center;justify-content:space-between;gap:.6rem;min-height:2.75rem}
.back{width:2.75rem;height:2.75rem;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.prog{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.prog div{height:100%;border-radius:4px;background:var(--ind);transition:width .4s}
/* tabs */
.tabs{display:flex;justify-content:space-around;align-items:flex-end;background:#fff;padding:6px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #e3e2f2;flex-shrink:0}
.tabs button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--mut);font-weight:800;min-width:0;min-height:44px;justify-content:flex-end}
.tabs button svg.i{width:1.45rem;height:1.45rem}
.tabs .on{color:var(--ind)}
.tabs .fab{flex:0 0 4rem;width:4rem;height:4rem;padding:0;gap:0;border-radius:50%;background:var(--ind);color:#fff;display:flex;align-items:center;justify-content:center;margin:-2rem .4rem 0;box-shadow:0 6px 14px rgba(63,55,201,.45);border:4px solid #fff}
.fab svg.i{width:1.8rem !important;height:1.8rem !important}
/* login */
.loginTop{background:var(--ind);color:#fff;border-radius:0 0 32px 32px;padding:calc(env(safe-area-inset-top) + 16px) 16px 22px;display:flex;flex-direction:column;align-items:center;position:relative}
.dots{display:flex;gap:14px;margin-top:14px}
.dots span{width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;transition:background .15s}
.dots span.on{background:#fff}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.key{height:3.6rem;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;box-shadow:0 2px 0 var(--line)}
.aplus{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 12px);background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:.35rem .6rem;font-weight:900;font-size:.95rem;min-height:44px;min-width:44px}
/* verify */
.mode{flex:1;align-items:center;padding:.7rem .3rem;border:2.5px solid transparent;text-align:center}
.mode.sel{border-color:var(--ind)}
.mode .blob{width:2.6rem;height:2.6rem}
.paste{background:#fff;border:2.5px dashed #b9b6ec;border-radius:18px;padding:.7rem .8rem}
.paste label{font-size:.75rem;color:var(--mut);font-weight:900;letter-spacing:.5px;display:block;margin-bottom:.2rem}
.paste textarea{width:100%;border:0;outline:0;resize:none;font-size:1rem;line-height:1.45;min-height:6.5rem;background:transparent;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:.45rem .8rem;font-size:.85rem;font-weight:800;min-height:44px}
/* analyzing */
.bigLight{background:#1b1b2f;border-radius:28px;padding:12px;display:flex;flex-direction:column;gap:10px;margin:0 auto}
.bigLight span{width:3.3rem;height:3.3rem;border-radius:50%;background:#3a3a4f;transition:all .2s}
.checks div{display:flex;gap:.6rem;align-items:center;font-weight:800;opacity:.25;transition:opacity .3s;padding:.35rem 0}
.checks div.ok{opacity:1}
.checks div.ok .ck{background:var(--g);color:#fff}
.ck{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center}
.ck svg.i{width:1rem;height:1rem;stroke-width:3}
/* result */
.resTop{color:#fff;border-radius:0 0 32px 32px;padding:calc(env(safe-area-inset-top) + 14px) 18px 18px}
.resTop.yellow{color:var(--ink)}
.light3{background:#1b1b2f;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px}
.light3 span{width:1.7rem;height:1.7rem;border-radius:50%;background:#3a3a4f}
.sig{flex:1;align-items:center;padding:.6rem .3rem;text-align:center;gap:.3rem}
.sig .blob{width:2.4rem;height:2.4rem;border-radius:12px}
.sig .s{color:var(--ink) !important;font-weight:800 !important;font-size:.8rem !important;line-height:1.15}
.todo div{display:flex;gap:.55rem;align-items:flex-start;font-size:1rem;font-weight:700;padding:.3rem 0;line-height:1.3}
/* lists */
.li{display:flex;align-items:center;gap:.8rem;background:#fff;border-radius:18px;padding:.8rem;box-shadow:0 2px 0 var(--line);text-align:left;width:100%;min-height:44px}
.li .t{font-weight:900;font-size:1rem;line-height:1.2}
.li .s{font-size:.85rem;color:var(--mut);font-weight:600}
.av{width:3rem;height:3rem;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;flex-shrink:0}
.pill{display:inline-block;font-size:.72rem;font-weight:900;padding:.15rem .55rem;border-radius:999px;background:var(--indl);color:var(--ind)}
.tog{width:3.1rem;height:1.8rem;border-radius:999px;background:#c9c8dc;position:relative;flex-shrink:0;transition:background .2s}
.tog::after{content:"";position:absolute;width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;top:.2rem;left:.2rem;transition:left .2s}
.tog.on{background:var(--g)}
.tog.on::after{left:1.5rem}
.seg{display:flex;background:#ecebf8;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border-radius:11px;padding:.5rem .2rem;font-weight:900;min-height:44px}
.seg .on{background:#fff;color:var(--ind);box-shadow:0 2px 0 var(--line)}
/* lesson video */
.video{border-radius:20px;aspect-ratio:16/10;position:relative;overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.2rem}
.video .play{width:4.2rem;height:4.2rem;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);display:flex;align-items:center;justify-content:center}
.video .cap{font-size:1.15rem;font-weight:900;line-height:1.3;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.video .bar{position:absolute;left:0;bottom:0;height:6px;background:rgba(255,255,255,.95);width:0}
/* chat */
.chatTop{background:var(--wa);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:.6rem}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:.5rem;background:#efeae2}
.bub{max-width:82%;padding:.55rem .75rem;border-radius:14px;font-size:1rem;line-height:1.4;font-weight:600;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.bub.them{background:#fff;align-self:flex-start;border-top-left-radius:4px}
.bub.me{background:#d9fdd3;align-self:flex-end;border-top-right-radius:4px}
.chatIn{display:flex;gap:.5rem;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#f0f0f0}
.chatIn input{flex:1;border:0;border-radius:999px;padding:0 1rem;min-height:3rem;outline:0}
.chatIn button{width:3rem;height:3rem;border-radius:50%;background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center}
/* sheet & toast */
.overlay{position:absolute;inset:0;background:rgba(20,18,50,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.75rem;max-height:90%;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40%)}}
.grab{width:44px;height:5px;border-radius:3px;background:#c9c8dc;margin:0 auto 4px}
.toast{position:absolute;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));background:#1b1b2f;color:#fff;border-radius:16px;padding:.8rem 1rem;font-weight:800;z-index:30;animation:up .2s ease;text-align:center}
.field{display:flex;flex-direction:column;gap:.25rem}
.field span{font-size:.85rem;font-weight:800;color:var(--mut)}
.field input,.field select{border:2px solid var(--line);border-radius:14px;padding:0 .9rem;min-height:3rem;background:#fff;outline:0;font-weight:700}
.field input:focus{border-color:var(--ind)}
/* splash & finger */
.splash{background:var(--ind);color:#fff;align-items:center;justify-content:center;gap:1rem}
.finger{position:absolute;inset:0;background:rgba(20,18,50,.6);z-index:25;display:flex;align-items:center;justify-content:center;animation:fade .2s}
.fbox{background:#fff;border-radius:28px;padding:1.6rem 1.4rem;width:82%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.fcirc{width:5.5rem;height:5.5rem;border-radius:50%;background:var(--indl);color:var(--ind);display:flex;align-items:center;justify-content:center;transition:all .3s}
.fcirc svg.i{width:3rem;height:3rem}
.fcirc.ok{background:var(--g);color:#fff}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.rec{width:5rem;height:5rem;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto;animation:pulse 1s infinite}
.rec svg.i{width:2.4rem;height:2.4rem}
.step{display:flex;gap:.8rem;align-items:flex-start}
.num{width:2.1rem;height:2.1rem;border-radius:50%;background:var(--ind);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.law{background:var(--indl);border-radius:18px;padding:.9rem;font-size:.95rem;line-height:1.45}
.acc summary{list-style:none;font-weight:900;display:flex;justify-content:space-between;gap:.5rem;align-items:center;min-height:44px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc[open] summary .chev{transform:rotate(90deg)}
.acc p{padding-top:.4rem}
.chev{transition:transform .2s;color:var(--mut)}
.demo{font-size:.72rem;color:var(--mut);text-align:center;font-weight:700}
</style>
</head>

  return {nivel, achados, tipo, texto};
}

  else { pilha.push({nome,p}); history.pushState({n:pilha.length}, ''); }

}
function voltar(){ if (pilha.length > 1) history.back(); else go('inicio',{},{raiz:true}); }

});

}

/* T-03 Verificar (passo 1 de 2) */

TELAS.noticia = () => TELAS.verificar({tipo:'noticia'});
async function colar(tx, upd){
  try{ const t = await navigator.clipboard.readText(); if (t && t.trim()){ tx.value = t; upd(); toast('Mensagem colada!'); return; } }catch(e){}
  tx.focus(); toast('Toque e segure na caixa e escolha “Colar”.');
}
function ouvir(tx, upd, exemplo){
  const o = sheet(`<div class="h2" style="text-align:center">Pode falar, estou ouvindo…</div>
    <div class="rec">${ic('mic')}</div><p class="p mut" style="text-align:center" id="ouv">Leia em voz alta a mensagem que você recebeu.</p>
    <button class="btn out" data-x>Parar</button>`);
  let feito = false;
  const fim = (texto) => { if (feito) return; feito = true; o.remove(); if (texto){ tx.value = texto; upd(); toast('Pronto! Transcrevemos sua fala.'); } };
  const simular = () => setTimeout(() => fim(exemplo), 2600);
  o.querySelector('[data-x]').onclick = () => fim(tx.value ? '' : exemplo);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return simular();
  try{
    const r = new SR(); r.lang='pt-BR'; r.interimResults=true; let final='';
    r.onresult = e => { final = [...e.results].map(x=>x[0].transcript).join(' '); const el=$('#ouv'); if(el) el.textContent='“'+final+'”'; };
    r.onerror = () => simular();
    r.onend = () => { if (final.trim()) fim(final); else if(!feito) simular(); };
    r.start();
  }catch(e){ simular(); }
}
function foto(tx, upd, exemplo){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange = () => {
    const o = sheet(`<div class="h2" style="text-align:center">Lendo o texto da foto…</div>
      <div class="fcirc pulse" style="margin:0 auto;background:#d6f1fa;color:var(--cyan)">${ic('cam')}</div>
      <p class="p mut" style="text-align:center">Isso leva só um instante.</p>`);
    setTimeout(() => { o.remove(); tx.value = exemplo; upd(); toast('Texto da foto encontrado!'); }, 2000);
  };
  inp.click();
}

  <div class="content">
    <div class="h1">Ajuda</div>
    <button class="tile" data-go="chat" style="flex-direction:row;align-items:center;gap:.8rem;background:var(--wa);box-shadow:0 4px 0 #13703b">
      <div class="blob" style="background:rgba(255,255,255,.2)">${ic('chat')}</div>
      <div><div class="t" style="color:#fff">Falar com uma pessoa</div><div class="s" style="color:#d5f5e1">Atendimento pelo WhatsApp</div></div></button>
    <button class="li" data-go="denunciar"><div class="blob" style="background:var(--rl);color:var(--r);width:2.6rem;height:2.6rem">${ic('flag')}</div>
      <div style="flex:1"><div class="t">Caí em um golpe</div><div class="s">O que fazer e como denunciar</div></div>${ic('right')}</button>
    <div class="h2">Perguntas frequentes</div>
    ${FAQ.map(([q,a])=>`<details class="card acc"><summary>${q}<span class="chev">${ic('right')}</span></summary><p class="p mut">${a}</p></details>`).join('')}
  </div>${abas('ajuda')}`});

/* Atendente (chat simulado) */
const RESP = {
  'Recebi uma mensagem estranha':'Não clique em nenhum link e não faça Pix. Use o botão “Verificar” do app ou me mande a mensagem aqui que eu te ajudo.',
  'Acho que caí em um golpe':'Calma, a senhora não tem culpa. Ligue agora para o seu banco e guarde os prints das mensagens. No app, a tela “Caí em um golpe” mostra o passo a passo.',
  'Como aviso minha família?':'Depois de verificar uma mensagem, toque em “Avisar minha família”. Seu filho Carlos e sua filha Ana recebem o aviso.'
};
TELAS.chat = () => ({ tema:'#1f9d55', html:`
  <div class="chatTop"><button class="back" data-back aria-label="Voltar" style="background:rgba(255,255,255,.2);color:#fff;box-shadow:none">${ic('left')}</button>
    <span class="av" style="background:#fff;color:var(--wa)">BI</span>
    <div style="flex:1"><div style="font-weight:900">Bia · Será Golpe?</div><div class="small" style="opacity:.9">Atendente · online</div></div></div>
  <div class="msgs" id="msgs">
    <div class="bub them">Olá, ${USER.apelido}! Eu sou a Bia, atendente do Será Golpe?. Como posso te ajudar? 😊</div>
  </div>
  <div style="background:#efeae2;padding:0 12px 8px" class="chips" id="qr">${Object.keys(RESP).map(k=>`<button class="chip" data-q="${k}">${k}</button>`).join('')}</div>
  <div class="chatIn"><input id="ci" placeholder="Escreva sua mensagem" aria-label="Mensagem"><button id="cs" aria-label="Enviar">${ic('send')}</button></div>`,
  montar(){
    const box = $('#msgs');
    const add = (t, me) => { const d=document.createElement('div'); d.className='bub '+(me?'me':'them'); d.textContent=t; box.appendChild(d); box.scrollTop=box.scrollHeight; };
    const responde = t => { const d=document.createElement('div'); d.className='bub them'; d.textContent='digitando…'; d.style.opacity=.6; box.appendChild(d); box.scrollTop=box.scrollHeight;
      setTimeout(()=>{ d.remove(); add(t,false); }, 1100); };
    app.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { add(b.dataset.q,true); responde(RESP[b.dataset.q]); });
    const enviar = () => { const v=$('#ci').value.trim(); if(!v) return; $('#ci').value=''; add(v,true);
      const r = analisar(v,'mensagem');
      responde(r.nivel==='verde' ? 'Obrigada pela mensagem! Uma atendente vai continuar a conversa com a senhora em instantes.' :
        `Cuidado! Essa mensagem tem sinais de golpe: ${r.achados.map(s=>s.rot.toLowerCase()).join(', ')}. Não faça nada antes de falar com sua família.`); };
    $('#cs').onclick = enviar; $('#ci').onkeydown = e => { if(e.key==='Enter') enviar(); };
  }});

/* Como denunciar (parte jurídica) */
TELAS.denunciar = () => ({ html:`
  <div class="content">${voltarBar()}
    <div class="h1">Caiu em um golpe?</div>
    <div class="card row" style="gap:.7rem;background:var(--gl)"><div class="blob" style="background:var(--g)">${ic('shield')}</div><p class="p" style="font-weight:800">Fique calma. Você não tem culpa: quem errou foi o golpista.</p></div>
    <div class="step card"><span class="num">1</span><div><div class="h2">Guarde as provas</div><p class="p mut">Tire print das mensagens, do número do golpista e do comprovante. Não apague nada.</p></div></div>
    <div class="step card"><span class="num">2</span><div style="flex:1"><div class="h2">Avise seu banco agora</div><p class="p mut">Se fez um Pix, peça a devolução pelo <b>MED</b> (Mecanismo Especial de Devolução). O prazo é de até 80 dias, mas quanto antes, maior a chance de recuperar o dinheiro.</p>
      <button class="btn out" style="margin-top:.6rem" id="banco">${ic('phone')}Ligar para o meu banco</button></div></div>
    <div class="step card"><span class="num">3</span><div style="flex:1"><div class="h2">Faça o boletim de ocorrência</div><p class="p mut">No Ceará, pela internet, a qualquer hora, na <b>Delegacia Eletrônica</b> da Polícia Civil. Ou vá à delegacia mais próxima.</p>
      <a class="btn out" style="margin-top:.6rem;text-decoration:none" href="https://www.delegaciaeletronica.ce.gov.br" target="_blank" rel="noopener">${ic('flag')}Abrir a Delegacia Eletrônica</a></div></div>
    <div class="step card"><span class="num">4</span><div style="flex:1"><div class="h2">Peça ajuda e denuncie</div><p class="p mut">O <b>Disque 100</b> (Direitos Humanos) recebe denúncias de violência contra a pessoa idosa. A ligação é gratuita.</p>
      <button class="btn out" style="margin-top:.6rem" id="d100">${ic('phone')}Ligar para o Disque 100</button></div></div>
    <div class="step card"><span class="num">5</span><div style="flex:1"><div class="h2">Conte para a família</div><p class="p mut">Você não precisa resolver isso sozinha.</p>
      <button class="btn pri" style="margin-top:.6rem" data-tab="familia">${ic('users')}Falar com minha família</button></div></div>
    <div class="law"><div class="row" style="gap:.5rem;margin-bottom:.4rem"><span style="color:var(--ind)">${ic('scale')}</span><b>Seus direitos</b></div>
      Golpe é crime de <b>estelionato</b> (art. 171 do Código Penal). Quando é feito por mensagem, rede social ou ligação, é <b>fraude eletrônica</b>, com pena de 4 a 8 anos de prisão (§ 2º-A). Se a vítima é idosa, a pena aumenta de 1/3 até o dobro (§ 4º).
      <div class="small mut" style="margin-top:.5rem">Informação educativa. Para orientação no seu caso, procure a Defensoria Pública ou um advogado.</div></div>
  </div>${abas('')}`,
  montar(){
    $('#banco').onclick = () => toast('Use o número que está atrás do seu cartão. (demonstração)');
    $('#d100').onclick = () => confirmar('Ligar para o Disque 100?','A ligação é gratuita e funciona todos os dias.','Ligar agora', () => { location.href='tel:100'; });
  }});

/* Perfil */
TELAS.perfil = () => { const g = S.historico.filter(h=>h.nivel==='vermelho').length; return { html:`
  <div class="content">${voltarBar()}
    <div style="display:flex;flex-direction:column;align-items:center;gap:.3rem">
      <span class="av" style="background:var(--pink);width:5rem;height:5rem;font-size:1.7rem">${USER.iniciais}</span>
      <div class="h1" style="text-align:center">${USER.nome}</div>
      <div class="mut" style="font-weight:700">${USER.idade} anos · ${USER.cidade}</div>
      <span class="pill">Plano ${USER.plano}</span>
    </div>
    <div class="grid2">
      <div class="card" style="text-align:center"><div class="h1" style="color:var(--ind)">${S.historico.length}</div><div class="small mut" style="font-weight:800">verificações</div></div>
      <div class="card" style="text-align:center"><div class="h1" style="color:var(--r)">${g}</div><div class="small mut" style="font-weight:800">golpes evitados</div></div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:.55rem">
      <div class="h2">Meus dados</div>
      <div class="row between small"><span class="mut" style="font-weight:700">Nascimento</span><b>${USER.nascimento}</b></div>
      <div class="row between small"><span class="mut" style="font-weight:700">Celular</span><b>${USER.celular}</b></div>
      <div class="row between small"><span class="mut" style="font-weight:700">Pessoa principal</span><b>${(CONTATOS.find(c=>c.principal)||CONTATOS[0]||{nome:'—'}).nome}</b></div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:.6rem">
      <div class="row" style="gap:.5rem"><span style="color:var(--ind)">${ic('text')}</span><div class="h2">Tamanho da letra</div></div>
      <div class="seg">${['Normal','Grande','Muito grande'].map((t,i)=>`<button data-f="${i+1}" class="${S.fonte===i+1?'on':''}" style="font-size:${.85+i*.12}rem">${t}</button>`).join('')}</div>
      <button class="row between" id="tDig" style="min-height:44px"><span class="row" style="gap:.5rem;font-weight:800">${ic('finger')}Entrar com a digital</span><span class="tog ${S.digital?'on':''}"></span></button>
      <button class="row between" id="tVoz" style="min-height:44px"><span class="row" style="gap:.5rem;font-weight:800">${ic('vol')}Ler resultados em voz alta</span><span class="tog ${S.voz?'on':''}"></span></button>
    </div>
    <div class="h2">Minhas verificações</div>
    ${S.historico.length ? S.historico.slice(0,5).map(h=>`<div class="li"><span class="ck" style="width:1.4rem;height:1.4rem;background:${NIVEIS[h.nivel].cor}"></span>
      <div style="flex:1;min-width:0"><div class="t" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem">${esc(h.texto)}</div><div class="s">${NIVEIS[h.nivel].kicker.replace('SINAL ','Sinal ').toLowerCase().replace('sinal','Sinal')} · ${h.quando}</div></div></div>`).join('')
      : `<p class="p mut">Você ainda não verificou nenhuma mensagem.</p>`}
    <div class="card" style="background:linear-gradient(135deg,#3f37c9,#7b2fbf);color:#fff;display:flex;flex-direction:column;gap:.4rem">
      <div class="row" style="gap:.5rem">${ic('star')}<b>Será Golpe? Premium</b></div>
      <p class="small" style="opacity:.95;font-weight:700">Avisos automáticos para até 5 familiares e atendimento prioritário.</p>
      <button class="btn" style="background:#fff;color:var(--ind);min-height:2.75rem" id="prem">Conhecer</button>
    </div>
    <button class="btn ghost" id="sair" style="color:var(--r)">${ic('out')}Sair do aplicativo</button>
    <p class="demo">Protótipo acadêmico · Design Thinking · AV2 · todos os dados são fictícios</p>
  </div>`,
  montar(){
    app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.fonte = +b.dataset.f; aplicaFonte(); salvar(); render(); });
    $('#tDig').onclick = () => { S.digital=!S.digital; salvar(); render(); };
    $('#tVoz').onclick = () => { S.voz=!S.voz; salvar(); render(); };
    $('#prem').onclick = () => toast('Em breve! (demonstração)');
    $('#sair').onclick = () => confirmar('Sair do aplicativo?','Para entrar de novo, use sua senha ou a digital.','Sair', () => go('entrar',{},{raiz:true}));
  }}; };

/* ============ INÍCIO ============ */
history.replaceState({n:1}, '');
go('splash', {}, {raiz:true});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
